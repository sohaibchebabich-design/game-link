<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رابط اللعبة</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #1e2130;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #2a2f45;
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 22px; margin: 0 0 24px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin-bottom: 12px;
    text-align: center;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #6c5ce7;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #5a4bd1; }
  #link-box {
    display: none;
    margin-top: 20px;
    background: #1e2130;
    border-radius: 10px;
    padding: 16px;
  }
  #welcome { font-size: 18px; margin-bottom: 12px; }
  #status { font-size: 13px; color: #aaa; margin-top: 6px; }
  a.game-link {
    display: block;
    background: #00b894;
    color: white;
    text-decoration: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    margin-top: 10px;
    word-break: break-all;
  }
  a.game-link:hover { background: #00a383; }
  #refresh-btn { background: transparent; border: 1px solid #444; margin-top: 10px; }
</style>
</head>
<body>

<div class="card">
  <div id="name-step">
    <h1>🎮 اكتب اسمك للدخول</h1>
    <input type="text" id="name-input" placeholder="اسمك">
    <button onclick="enterSite()">دخول</button>
  </div>

  <div id="link-step" style="display:none;">
    <p id="welcome"></p>
    <div id="link-box" style="display:block;">
      <p style="color:#aaa; font-size:13px; margin:0 0 8px;">رابط المباراة الحالية</p>
      <a href="#" id="game-link" class="game-link" target="_blank">جارٍ التحميل...</a>
      <p id="status"></p>
    </div>
    <button id="refresh-btn" onclick="loadLink()">🔄 تحديث الرابط</button>
  </div>
</div>

<script>
function enterSite() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) return;
  document.getElementById('welcome').textContent = 'أهلاً ' + name + '! 👋';
  document.getElementById('name-step').style.display = 'none';
  document.getElementById('link-step').style.display = 'block';
  loadLink();
}

function loadLink() {
  const el = document.getElementById('game-link');
  const status = document.getElementById('status');
  el.textContent = 'جارٍ التحميل...';
  status.textContent = '';

  fetch('data.json?t=' + Date.now())
    .then(res => res.json())
    .then(data => {
      if (data && data.url) {
        el.textContent = data.url;
        el.href = data.url;
        if (data.updatedAt) {
          const d = new Date(data.updatedAt);
          status.textContent = 'آخر تحديث: ' + d.toLocaleString('ar');
        }
      } else {
        el.textContent = 'ما فيه رابط بعد';
        el.removeAttribute('href');
      }
    })
    .catch(() => {
      el.textContent = 'ما فيه رابط بعد';
      el.removeAttribute('href');
    });
}

document.getElementById('name-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') enterSite();
});
</script>

</body>
</html>
